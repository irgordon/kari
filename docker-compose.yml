name: kari

services:
  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: kari
      POSTGRES_USER: kari
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kari_dev_database_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backplane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kari -d kari"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: ${KARI_API_IMAGE:-kari-api:local}
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:?GO_BUILDER_IMAGE is required}
    entrypoint: ["/app/kari-migrate"]
    environment:
      DATABASE_URL: postgres://kari:${DB_PASSWORD:-kari_dev_database_only}@db:5432/kari?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backplane
    restart: "no"

  api:
    image: ${KARI_API_IMAGE:-kari-api:local}
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:?GO_BUILDER_IMAGE is required}
    user: "1001:1001"
    environment:
      KARI_ENV: ${KARI_ENV:-development}
      DATABASE_URL: postgres://kari:${DB_PASSWORD:-kari_dev_database_only}@db:5432/kari?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-kari_development_jwt_secret_only}
      KARI_SETUP_TOKEN: ${KARI_SETUP_TOKEN:-}
      KARI_VERSION: ${KARI_VERSION:-development}
      KARI_PUBLIC_URL: ${KARI_PUBLIC_URL:-}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
      KARI_SMTP_HOST: ${KARI_SMTP_HOST:-}
      KARI_SMTP_PORT: ${KARI_SMTP_PORT:-587}
      KARI_SMTP_USERNAME: ${KARI_SMTP_USERNAME:-}
      KARI_SMTP_PASSWORD: ${KARI_SMTP_PASSWORD:-}
      KARI_SMTP_FROM: ${KARI_SMTP_FROM:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      KARI_TRUSTED_PROXY_CIDRS: ${KARI_PROXY_IP:-172.30.231.3}/32
      PORT: "8080"
      AGENT_SOCKET: /run/kari/agent.sock
      KARI_REQUIRE_AGENT: ${KARI_REQUIRE_AGENT:-false}
      HEALTHCHECK_TARGET: http://localhost:8080/ready
    volumes:
      - type: bind
        source: ${KARI_AGENT_SOCKET_DIR:-/run/kari}
        target: /run/kari
    ports:
      - "${KARI_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backplane
      - frontend
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    image: ${KARI_FRONTEND_IMAGE:-kari-frontend:local}
    volumes:
      - ${KARI_FRONTEND_CONFIG:-./frontend/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NODE_BUILDER_IMAGE: ${NODE_BUILDER_IMAGE:?NODE_BUILDER_IMAGE is required}
        FRONTEND_RUNTIME_IMAGE: ${FRONTEND_RUNTIME_IMAGE:?FRONTEND_RUNTIME_IMAGE is required}
    ports:
      - "${KARI_FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_started
    networks:
      frontend:
        ipv4_address: ${KARI_PROXY_IP:-172.30.231.3}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

networks:
  backplane:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: ${KARI_PROXY_SUBNET:-172.30.231.0/24}

volumes:
  postgres_data:
