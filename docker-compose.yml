name: kari

services:
  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: kari
      POSTGRES_USER: kari
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kari_dev_database_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backplane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kari -d kari"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: kari-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:?GO_BUILDER_IMAGE is required}
    entrypoint: ["/app/kari-migrate"]
    environment:
      DATABASE_URL: postgres://kari:${DB_PASSWORD:-kari_dev_database_only}@db:5432/kari?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backplane
    restart: "no"

  api:
    image: kari-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:?GO_BUILDER_IMAGE is required}
    user: "1001:1001"
    environment:
      KARI_ENV: ${KARI_ENV:-development}
      DATABASE_URL: postgres://kari:${DB_PASSWORD:-kari_dev_database_only}@db:5432/kari?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-kari_development_jwt_secret_only}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: "8080"
      AGENT_SOCKET: /run/kari/agent.sock
      KARI_REQUIRE_AGENT: ${KARI_REQUIRE_AGENT:-false}
      HEALTHCHECK_TARGET: http://localhost:8080/ready
    volumes:
      - type: bind
        source: ${KARI_AGENT_SOCKET_DIR:-/run/kari}
        target: /run/kari
    ports:
      - "${KARI_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backplane
      - frontend
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NODE_BUILDER_IMAGE: ${NODE_BUILDER_IMAGE:?NODE_BUILDER_IMAGE is required}
        FRONTEND_RUNTIME_IMAGE: ${FRONTEND_RUNTIME_IMAGE:?FRONTEND_RUNTIME_IMAGE is required}
    ports:
      - "${KARI_FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

networks:
  backplane:
    internal: true
  frontend:

volumes:
  postgres_data:
