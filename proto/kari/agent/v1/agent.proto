// proto/kari/agent/v1/agent.proto
syntax = "proto3";

package kari.agent.v1;

// 🛡️ SOLID: Namespaced for Go internal visibility
option go_package = "github.com/irgordon/kari/api/internal/grpc/rustagent;rustagent";

// ==============================================================================
// 1. The gRPC Service Definition (The Contract)
// ==============================================================================

service SystemAgent {
  rpc DeployNodeSite(StaticSiteRequest) returns (AgentResponse);
  rpc SiteRuntime(RuntimeRequest) returns (RuntimeStatus);
  rpc SiteDatabase(DatabaseRequest) returns (DatabaseStatus);
  rpc SiteFiles(FileRequest) returns (FileResult);
  rpc SiteSFTP(SFTPRequest) returns (SFTPStatus);
  rpc SiteBackups(BackupRequest) returns (BackupResult);
  rpc HostServices(HostServiceRequest) returns (HostServiceStatus);
  rpc DeployStaticSite(StaticSiteRequest) returns (AgentResponse);
  rpc SetSiteChallenge(SiteChallenge) returns (AgentResponse);
  rpc ActivateSiteTLS(SiteCertificate) returns (AgentResponse);
  // 🛡️ SLA: Heartbeat & Resource Monitoring for the Brain's Prober
  rpc GetSystemStatus (Empty) returns (SystemStatus);

  // 📦 Execution & Isolation
  rpc ExecutePackageCommand(PackageRequest) returns (AgentResponse);
  rpc ProvisionAppJail(ProvisionJailRequest) returns (AgentResponse);
  rpc ManageService(ServiceRequest) returns (AgentResponse);
  
  // 🛡️ SLA Enforcement: Server-Side Streaming for Log Backpressure
  rpc StreamDeployment(DeployRequest) returns (stream LogChunk);

  // 🔥 Resource Teardown
  rpc DeleteDeployment(DeleteRequest) returns (AgentResponse);
  rpc TeardownJail(TeardownRequest) returns (AgentResponse);

  // 🛠️ Filesystem & Infrastructure
  rpc WriteSystemFile(FileWriteRequest) returns (AgentResponse);
  rpc InstallCertificate(SslPayload) returns (AgentResponse);
  
  // 🛡️ Abstract Policy Intent
  rpc ApplyFirewallPolicy(FirewallPolicy) returns (AgentResponse);
  rpc ScheduleJob(JobIntent) returns (AgentResponse);
}

message StaticSiteRequest {
  string site_id = 1;
  string domain_name = 2;
  string repo_url = 3;
  string branch = 4;
  string deployment_id = 5;
}

message RuntimeRequest { string site_id = 1; string domain_name = 2; string action = 3; map<string,string> env_vars = 4; }
message RuntimeStatus { bool running = 1; string logs = 2; }
message DatabaseRequest { string site_id = 1; string domain_name = 2; string action = 3; string password = 4; }
message DatabaseStatus { bool exists = 1; string host = 2; string database = 3; string username = 4; }
message FileRequest { string site_id = 1; string domain_name = 2; string action = 3; string path = 4; bytes content = 5; }
message FileEntry { string name = 1; bool directory = 2; uint64 size = 3; }
message FileResult { repeated FileEntry entries = 1; bytes content = 2; }
message SFTPRequest { string site_id = 1; string domain_name = 2; string action = 3; string public_key = 4; }
message SFTPStatus { bool enabled = 1; string username = 2; }
message BackupRequest { string site_id = 1; string domain_name = 2; string action = 3; string backup_id = 4; }
message BackupRecord { string id = 1; string created_at = 2; }
message BackupResult { repeated BackupRecord backups = 1; string runtime = 2; bool database_exists = 3; string repository = 4; string branch = 5; bytes certificate_pem = 6; }
message HostServiceRequest { string service = 1; string action = 2; }
message HostServiceStatus { map<string,string> services = 1; }

message SiteChallenge {
  string site_id = 1;
  string domain_name = 2;
  string token = 3;
  string key_authorization = 4;
  bool remove = 5;
}

message SiteCertificate {
  string site_id = 1;
  string domain_name = 2;
  bytes fullchain_pem = 3;
  bytes privkey_pem = 4;
}

// ==============================================================================
// 2. Telemetry & Standardized Responses
// ==============================================================================

message Empty {}

message SystemStatus {
  bool healthy = 1;
  uint32 active_jails = 2;
  float cpu_usage_percent = 3;
  float memory_usage_mb = 4;
  string agent_version = 5;
  uint64 uptime_seconds = 6;
  uint64 memory_total_bytes = 7;
  uint64 memory_used_bytes = 8;
  uint64 disk_total_bytes = 9;
  uint64 disk_available_bytes = 10;
}

message AgentResponse {
  bool success = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  string error_message = 5;
}

// 🛡️ Real-time observability payload for SvelteKit SSE
message LogChunk {
  string trace_id = 1;
  string content = 2; // Raw ANSI output from the Rust sub-process
}

// ==============================================================================
// 3. Abstract Intent Payloads (Zero-Trust & OS-Agnostic)
// ==============================================================================

message FirewallPolicy {
  enum Action { ALLOW = 0; DENY = 1; REJECT = 2; }
  enum Protocol { TCP = 0; UDP = 1; BOTH = 2; }
  
  Action action = 1;
  uint32 port = 2; // Validated in Rust as 1-65535
  Protocol protocol = 3;
  
  // 🛡️ Optional: Enforces strict source-based filtering
  optional string source_ip = 4; 
}

message JobIntent {
  string job_name = 1;
  
  // 🛡️ Zero-Trust: Split to prevent shell injection via OS execve
  string binary = 2;
  repeated string args = 3;
  
  string schedule_expression = 4; // Cron format
  string run_as_user = 5;
}

message SslPayload {
  string domain_name = 1;
  bytes fullchain_pem = 2;
  bytes privkey_pem = 3; // 🛡️ Privacy: Rust agent must zeroize this buffer!
}

// ==============================================================================
// 4. Operational Payloads
// ==============================================================================

message PackageRequest {
  string command = 1;         
  repeated string args = 2;   
}

message FileWriteRequest {
  string trace_id = 1;        
  string absolute_path = 2;   
  bytes content = 3;          
  string owner = 4;           
  string group = 5;           
  string file_mode = 6;       
}

message ServiceRequest {
  string service_name = 1;    
  ServiceAction action = 2;   
}

message ProvisionJailRequest {
  string app_id = 1;          
  string domain_name = 2;     
  string start_command = 3;   
  map<string, string> env_vars = 4; 
  uint32 memory_limit_mb = 5; // 🛡️ SLA: Hard-limit enforcement
}

message DeployRequest {
  string trace_id = 1;        // Links stream to Dashboard Action Center
  string app_id = 2;
  string domain_name = 3;
  string repo_url = 4;        
  string branch = 5;          
  string build_command = 6;   
  map<string, string> env_vars = 7;
  optional int32 port = 8;    // App internal port for proxy
  optional string ssh_key = 9; // 🛡️ Privacy: Transient SSH key
}

message DeleteRequest {
  string app_id = 1;
  string domain_name = 2;
}

message TeardownRequest {
  string app_id = 1;
  string trace_id = 2;  // Links to deployment telemetry
}

enum ServiceAction {
  START = 0;
  STOP = 1;
  RESTART = 2;
  RELOAD = 3;
  ENABLE = 4;
  DISABLE = 5;
}
