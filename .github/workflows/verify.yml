name: Kari Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify / ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage:
          - preflight
          - go
          - rust
          - frontend
          - proto
          - database
          - topology
          - static
          - docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned toolchains
        id: versions
        run: ./scripts/export-toolchain.sh

      - name: Set up Go
        if: contains(fromJSON('["preflight","go","proto","database","static"]'), matrix.stage)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache-dependency-path: go.sum

      - name: Set up Rust
        if: contains(fromJSON('["preflight","rust"]'), matrix.stage)
        run: rustup toolchain install "${{ steps.versions.outputs.rust }}" --profile minimal --component rustfmt --component clippy

      - name: Set up Node
        if: contains(fromJSON('["preflight","frontend"]'), matrix.stage)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned protoc
        if: contains(fromJSON('["preflight","rust","proto"]'), matrix.stage)
        run: |
          ./scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install pinned Go protobuf generators
        if: contains(fromJSON('["preflight","proto"]'), matrix.stage)
        run: |
          source toolchain.env
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run verification stage
        run: make "verify-${{ matrix.stage }}"

  kari-verify:
    name: Kari Verify
    runs-on: ubuntu-24.04
    if: always()
    needs: [verify]
    steps:
      - name: Require every verification stage
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
